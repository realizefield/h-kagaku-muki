<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>無機化学 暗記マスター｜江原予備校</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#faf7f2;--card:#fff;--ink:#2b2a33;--sub:#6b6a76;--line:#e8e2d8;--pri:#2f7fd0;--pri2:#1f5fa6;--acc:#e0902a;--red:#d9322b;--ok:#1f9d78;--ng:#d9322b;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#17171c;--card:#22222a;--ink:#ecebf2;--sub:#a3a2b0;--line:#33333d;--pri:#5aa2ee;--pri2:#7db6f2;--red:#ff6b61}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.75;font-size:16px}
#app{max-width:860px;margin:0 auto;padding-bottom:84px}
.top{padding:14px 16px 6px}
.logo{font-weight:800;font-size:18px;display:flex;align-items:baseline;gap:10px}
.logo small{font-weight:500;color:var(--sub);font-size:12px}
main{padding:0 14px}
h1{font-size:22px;line-height:1.4;margin:.4em 0}
h1.pg{margin-top:12px}
h2.sec{font-size:15px;margin:22px 0 8px;color:var(--sub);letter-spacing:.04em;font-weight:700}
.lead{color:var(--sub);margin:.2em 0 1em}
.small{font-size:13px;color:var(--sub)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:172px;border:0;background:none;padding:8px 2px 7px;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;min-height:56px}
.tabs button .ic{font-size:21px;line-height:1.2}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs button.on .ic{transform:translateY(-1px) scale(1.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.card h2{font-size:16px;margin:.1em 0 .6em}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#eaf3ff,#fff3e0);border-radius:20px;padding:16px;margin:8px 0}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#1f2a3d,#33291c)}}
.heroL{flex:0 0 112px}.ring{width:112px;height:112px}
.ring .bg{fill:none;stroke:rgba(120,120,140,.25);stroke-width:10}
.ring .fg{fill:none;stroke:var(--pri);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:55px 55px;transition:stroke-dashoffset .6s}
.ring .n{font-size:24px;font-weight:800;fill:var(--ink)}.ring .s{font-size:11px;fill:var(--sub)}
.heroR h1{margin:0 0 4px;font-size:22px}.heroR p{margin:.2em 0 .8em;font-size:14.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.btnrow.center{justify-content:center}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--pri)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri2)}
.btn.big{font-size:17px;padding:12px 26px;min-height:52px}
.btn.small{font-size:13px;padding:6px 12px;min-height:34px}
.btn.danger{background:#d9322b;border-color:#d9322b;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stars{letter-spacing:1px;white-space:nowrap;font-size:14px}
.stars.s3{color:#e8a200}.stars.s2{color:#4f9bd8}.stars.s1{color:#8aa39a}
.stars .dim{opacity:.22}
.legend{display:grid;gap:8px}.legend>div{display:flex;gap:10px;align-items:baseline;font-size:14.5px}
.legend .stars{flex:0 0 54px}
.bars{margin-top:12px;display:grid;gap:6px}
.bar{display:flex;align-items:center;gap:10px}
.bar .bl{flex:0 0 54px}.bar .bp{flex:0 0 56px;font-size:12px;color:var(--sub);text-align:right}
.track{flex:1;height:10px;background:rgba(120,120,140,.2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--pri),#5ac0a8);border-radius:99px;transition:width .5s}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:12px 14px}
.uh{display:flex;gap:8px;align-items:center;margin-bottom:8px;line-height:1.35}.ui{font-size:24px}
.um{font-size:12px;color:var(--sub);margin:4px 0 8px}
.ub{display:flex;gap:6px;flex-wrap:wrap}
.ub button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;cursor:pointer;min-height:40px}
.ub button:hover{border-color:var(--c)}
.note p{margin:.4em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;padding:6px 13px;cursor:pointer;min-height:38px}
.chip.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff;font-weight:700}
.chip.small{font-size:13px;padding:4px 11px;min-height:34px}
.stickybar{position:sticky;top:0;background:var(--bg);z-index:20;padding:8px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.stickybar .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.stickybar .chip{white-space:nowrap;flex:0 0 auto}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px;margin-right:6px}
.switch input{position:absolute;opacity:0;width:0;height:0}
.sl{width:46px;height:26px;background:#bbb;border-radius:99px;position:relative;transition:.2s}
.sl:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.sl{background:var(--red)}
.switch input:checked+.sl:after{left:23px}
.switch input:focus-visible+.sl{outline:3px solid var(--pri)}
.uhead{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:12px 16px;margin:14px 0 4px}
.uhead h1{margin:0 0 6px;font-size:21px}
.top3{background:rgba(232,162,0,.12);border-radius:12px;padding:8px 14px}
.top3 b{color:#b87800}.top3 ol{margin:.3em 0 .2em;padding-left:1.3em}.top3 li{margin:.15em 0;font-size:15px}
.mnlist{display:grid;gap:10px}
.mn{background:var(--card);border:1px dashed #e0902a;border-radius:14px;padding:10px 14px}
.mk{font-size:12px;font-weight:700;color:#b87800;letter-spacing:.05em}
.mm{font-size:18px;font-weight:800;margin:2px 0;color:var(--ink)}
.md{font-size:14px;color:var(--sub)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:rgba(120,120,140,.12);font-size:13px;white-space:nowrap}
th.rh{background:rgba(120,120,140,.07);white-space:nowrap}
tr:last-child td,tr:last-child th{border-bottom:0}
/* 赤字(穴埋め) */
.cz{color:var(--red);font-weight:700;border-radius:5px;padding:0 3px;cursor:pointer;transition:background .15s}
.cz:focus-visible{outline:3px solid var(--pri)}
.sheeton .cz:not(.open),.hidecz .cz:not(.open),.cz.hide:not(.open){background:var(--red);color:transparent;text-shadow:none;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sheeton .cz:not(.open)>*,.hidecz .cz:not(.open)>*{visibility:hidden}
.cz.open{background:rgba(217,50,43,.1)}
.plist{display:grid;gap:8px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid #cfd8d2;border-radius:12px;padding:10px 12px}
.pt.i3{border-left-color:#e8a200}.pt.i2{border-left-color:#4f9bd8}
.pl{flex:0 0 52px;padding-top:2px}.pb{flex:1;min-width:0;font-size:15.5px;word-break:break-word}
.okb{flex:0 0 auto;border:1.5px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer;min-height:34px;white-space:nowrap}
.okb.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.cprog{display:flex;align-items:center;gap:10px;margin:12px 0}.cprog span{font-size:13px;color:var(--sub);min-width:56px;text-align:right}
.fcard,.qcard{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c,var(--pri));border-radius:20px;padding:16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.fbody{font-size:19px;line-height:2.1;min-height:130px;word-break:break-word}
.fbody .cz{padding:1px 6px;margin:0 1px}
.fhint{font-size:12px;color:var(--sub);margin-top:6px}
.qq{font-size:18px;font-weight:700;line-height:1.6;margin:6px 0 14px}
.qq.big{font-size:22px;text-align:center;padding:10px 0}
.qsub{text-align:center;color:var(--sub);margin-top:-8px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.ol{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(120,120,140,.2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.opt.right{border-color:var(--ok);background:rgba(31,157,120,.12)}
.opt.wrong{border-color:var(--ng);background:rgba(217,50,43,.1)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.fb{margin-top:14px;border-radius:12px;padding:10px 14px}
.fb p{margin:.3em 0 0;font-size:14.5px}
.fb.ok{background:rgba(31,157,120,.12);border:1px solid var(--ok)}
.fb.ng{background:rgba(217,50,43,.08);border:1px solid var(--ng)}
.copts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.copt{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:92px}
.copt:hover:not(:disabled){border-color:var(--pri)}
.copt.right{border-color:var(--ok);background:rgba(31,157,120,.12)}.copt.wrong{border-color:var(--ng);background:rgba(217,50,43,.1)}
.copt:disabled{cursor:default;color:var(--ink)}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:-3px;margin-right:4px}
.dot.lg{width:42px;height:42px;margin:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;font-size:13px}
.sw{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.done{text-align:center;padding:10px 0}
.big-emoji{font-size:60px;line-height:1.2}
.score{font-size:54px;font-weight:800;color:var(--pri)}.score small{font-size:22px;color:var(--sub)}
.review{text-align:left;margin:14px 0}.review h2{font-size:16px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.rq{font-weight:700}.ra{margin:.2em 0}.re{font-size:14px;color:var(--sub)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti span{position:absolute;top:-30px;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
@media (max-width:520px){.hero{flex-direction:column;text-align:center}.heroR h1{font-size:20px}.btnrow{justify-content:center}.fbody{font-size:18px}.copts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mn.haseq{position:relative;cursor:pointer;padding-top:30px;transition:border-color .15s,background .15s}
.mn.haseq:hover{border-color:var(--pri)}
.mn.haseq:focus-visible{outline:3px solid var(--pri)}
.eqlab{position:absolute;left:10px;top:8px;background:var(--pri);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;letter-spacing:.03em}
.mn.haseq.open .eqlab{background:var(--ok)}
.eqbox{margin-top:8px}
.eqhint{display:block;font-size:12px;color:var(--sub)}
.eqlines{display:none;margin-top:2px;background:rgba(47,127,208,.08);border:1px solid rgba(47,127,208,.35);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700;line-height:1.9;word-break:break-word}
.mn.haseq.open .eqlines{display:block}
.mn.haseq.open .eqhint{display:none}

.ptbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:-4px 0 8px}
.ptcnt{font-size:13px;color:var(--sub)}
.allok{text-align:center;padding:22px 12px;background:var(--card);border:1px dashed var(--ok);border-radius:12px;font-weight:700;line-height:1.8}

.qimg{display:block;max-width:100%;height:auto;margin:10px auto;border:1px solid var(--line);border-radius:10px;background:#fff}
</style></head><body><div id="app"></div>

 p:[
  [3,"アルカリ金属は{{Li・Na・K・Rb・Cs・Fr}}。価電子{{1}}個で{{1価の陽イオン}}になりやすい。"],
  [3,"アルカリ金属は原子番号が大きいほど、イオン化エネルギーが{{小さく}}なり、反応性が{{強く}}なる。イオン化エネルギーは {{K＜Na＜Li}}。"],
  [3,"アルカリ金属は水と激しく反応し{{H₂}}を発生する。2Na ＋ 2H₂O → {{2NaOH}} ＋ H₂。空気中の酸素や水と反応するので{{石油（灯油）}}中に保存。"],
  [3,"炎色反応：Liは{{赤}}、Naは{{黄}}、Kは{{赤紫}}、Cuは{{青緑}}、Caは{{橙赤}}、Srは{{紅（深赤）}}、Baは{{黄緑}}。"],
  [2,"アルカリ金属の単体は{{融解塩電解}}で作る。2NaCl → 2Na ＋ {{Cl₂}}"],
  [3,"NaOHは白色固体で強塩基。空気中の水分を吸って溶ける性質を{{潮解}}という。CO₂を吸収して{{Na₂CO₃}}になる。"],
  [2,"NaOHの製法：NaCl水溶液の電気分解。2NaCl ＋ 2H₂O → {{2NaOH}} ＋ H₂ ＋ Cl₂。陰極側にNaOH、陽極から{{Cl₂}}。"],
  [3,"アンモニアソーダ法（ソルベー法）：NaCl ＋ NH₃ ＋ CO₂ ＋ H₂O → {{NaHCO₃}} ＋ NH₄Cl。溶解度が{{小さい}}NaHCO₃が沈殿する。"],
  [3,"アンモニアソーダ法の後半：2NaHCO₃ → {{Na₂CO₃}} ＋ H₂O ＋ {{CO₂}}（加熱）。CaCO₃ → CaO ＋ CO₂、CaO ＋ H₂O → Ca(OH)₂、2NH₄Cl ＋ Ca(OH)₂ → CaCl₂ ＋ 2H₂O ＋ {{2NH₃}}。"],
  [3,"Na₂CO₃・10H₂Oを空気中に置くと水和水を失い粉末になる現象を{{風解}}という。潮解は水分を吸って{{溶ける}}現象。"],
  [2,"Na₂CO₃もNaHCO₃も、塩酸を加えると{{CO₂}}が発生する（弱酸遊離）。NaHCO₃水溶液は弱{{塩基}}性。"],
  [3,"2族は価電子{{2}}個で{{2価の陽イオン}}になりやすい。{{Ca・Sr・Ba・Ra}}をアルカリ土類金属といい、{{Be・Mg}}は含まない。"],
  [2,"Ba²⁺・Ca²⁺はSO₄²⁻と{{白色}}沈殿（BaSO₄・CaSO₄）、CO₃²⁻とも{{白色}}沈殿（BaCO₃・CaCO₃）をつくる。"],
  [3,"石灰水（Ca(OH)₂水溶液）にCO₂：Ca(OH)₂ ＋ CO₂ → {{CaCO₃}}↓（白濁）。さらにCO₂で CaCO₃ ＋ CO₂ ＋ H₂O → {{Ca(HCO₃)₂}}（溶けて透明）。"],
  [2,"CaCO₃ → {{CaO}} ＋ CO₂（強熱）。CaO（{{生石灰}}）＋ H₂O → {{Ca(OH)₂}}（{{消石灰}}）で発熱する。"],
  [2,"CaOは{{吸湿}}性があり乾燥剤に使う。水を加えると発熱するので弁当や日本酒の加熱にも使われる。"],
  [2,"カーバイド：CaO ＋ 3C → {{CaC₂}} ＋ CO。CaC₂ ＋ 2H₂O → Ca(OH)₂ ＋ {{C₂H₂（アセチレン）}}。"],
  [2,"セッコウ{{CaSO₄・2H₂O}}を加熱すると{{焼きセッコウ}}CaSO₄・½H₂Oになり、水で練ると固まる（ギプス）。"],
  [2,"さらし粉：Ca(OH)₂ ＋ Cl₂ → {{CaCl(ClO)・H₂O}}。プールの消毒などに使う。"],
  [2,"BaSO₄は白色で水に溶けにくく、{{X線}}の造影剤や白色顔料に使う。"],
  [2,"CaCl₂は{{潮解}}性が大きく乾燥剤に使う（ただし{{NH₃}}の乾燥には不可）。"],
  [2,"Mgを含む軽くて強い合金{{ジュラルミン}}はAl・Cu・Mgの合金。MgCl₂は豆腐の凝固剤（{{にがり}}）、MgOは耐火れんがに使う。"],
  [1,"鍾乳洞：CO₂を含む雨水でCaCO₃が{{Ca(HCO₃)₂}}となって溶け出し、洞窟で再びCaCO₃になる。"],
  [1,"Ca²⁺・Mg²⁺を多く含む水を{{硬水}}という。"]
 ]

{u:"u3",i:3,q:"濃硝酸中で不動態になる金属の組み合わせは？",o:["Fe・Ni・Al","Cu・Ag・Hg","Zn・Mg・Ca","Pt・Au・Ag"],a:0,e:"手にある黒いコーラ：Fe・Ni・Al・Cr・Co。緻密な酸化被膜ができます。"},
{u:"u3",i:3,q:"硝酸の工業的製法（オストワルト法）で、最初の反応の触媒は？",o:["Pt","Fe₃O₄","V₂O₅","MnO₂"],a:0,e:"4NH₃ ＋ 5O₂ → 4NO ＋ 6H₂O（約800℃、Pt触媒）。"},
{u:"u3",i:3,q:"オストワルト法をまとめた反応式は？",o:["NH₃ ＋ 2O₂ → HNO₃ ＋ H₂O","N₂ ＋ 3H₂ → 2NH₃","4NH₃ ＋ 5O₂ → 4NO ＋ 6H₂O","2NO ＋ O₂ → 2NO₂"],a:0,e:"3段階を足し合わせると NH₃ ＋ 2O₂ → HNO₃ ＋ H₂O。"},
{u:"u3",i:3,q:"濃硝酸を褐色びんに入れる理由は？",o:["光で分解してNO₂とO₂を生じるから","空気中の水分を吸うから","ガラスを侵すから","不動態になるから"],a:0,e:"4HNO₃ → 4NO₂ ＋ 2H₂O ＋ O₂。"},
{u:"u3",i:2,q:"黄リンの保存方法は？",o:["水中","石油中","空気中","濃硫酸中"],a:0,e:"黄リンは空気中で自然発火する猛毒物質なので水中に保存。石油中はアルカリ金属。"},
{u:"u3",i:2,q:"リンの燃焼で生じる、吸湿性の強い乾燥剤になる物質は？",o:["P₄O₁₀","H₃PO₄","PH₃","Ca₃(PO₄)₂"],a:0,e:"4P ＋ 5O₂ → P₄O₁₀（十酸化四リン）。水に溶けるとリン酸になります。"},
{u:"u3",i:2,q:"NH₃ 1.0 molを原料に、硝酸をつくるのに必要なO₂は何mol？",o:["1 mol","2 mol","4 mol","5 mol"],a:1,e:"NH₃ ＋ 2O₂ → HNO₃ ＋ H₂O より2mol。"},
// ---- u4
{u:"u4",i:3,q:"電気をよく通す炭素の同素体は？",o:["黒鉛","ダイヤモンド","どちらも通さない","どちらも通す"],a:0,e:"黒鉛は4つの価電子のうち1つが余っているため電気を通します。"},
{u:"u4",i:3,q:"石灰水にCO₂を通し続けたときの変化は？",o:["白濁 → 透明になる","ずっと白濁したまま","透明のまま変化なし","青色になる"],a:0,e:"CaCO₃（白濁）→ さらにCO₂でCa(HCO₃)₂（水に溶けて透明）。加熱すると再び白濁。"},
{u:"u4",i:3,q:"石灰石に希硫酸でなく希塩酸を使う理由は？",o:["CaSO₄が表面を覆い反応が止まるから","硫酸は揮発するから","塩酸の方が安いから","硫酸は還元剤だから"],a:0,e:"難溶性のCaSO₄が石灰石の表面を覆ってしまいます。"},
{u:"u4",i:3,q:"COの捕集法は？",o:["水上置換","下方置換","上方置換","どれでもよい"],a:0,e:"COは水に溶けにくく、空気とほぼ同じ重さ。水上置換で集めます。CO₂は下方置換。"},
{u:"u4",i:3,q:"SiO₂と反応して溶かす酸は？",o:["フッ化水素酸","塩酸","硝酸","硫酸"],a:0,e:"SiO₂ ＋ 6HF → H₂SiF₆ ＋ 2H₂O。"},
{u:"u4",i:3,q:"ケイ素の単体について誤っているものは？",o:["天然に単体として産出する","ダイヤモンド型の共有結合の結晶","半導体として使われる","SiO₂をCで還元して得る"],a:0,e:"ケイ素は天然にはSiO₂などの化合物として存在し、単体では産出しません。"},
{u:"u4",i:3,q:"Na₂SiO₃（水ガラス）に塩酸を加えると生じるのは？",o:["ケイ酸H₂SiO₃","SiO₂","SiH₄","Si"],a:0,e:"弱酸遊離。ケイ酸を脱水したものがシリカゲル。"},
{u:"u4",i:3,q:"COの製法で、ギ酸に濃硫酸を加えるときの濃硫酸のはたらきは？",o:["脱水作用","酸化作用","吸湿性","不揮発性"],a:0,e:"HCOOH → CO ＋ H₂O。ギ酸から水を奪います。"},
{u:"u4",i:2,q:"普通のガラス（ソーダ石灰ガラス）について正しいものは？",o:["決まった融点をもたず、加熱でしだいに軟化する","結晶の物質で融点が一定","原料はSiO₂のみ","電気をよく通す"],a:0,e:"ガラスは非晶質（アモルファス）で、決まった融点をもちません。"},
{u:"u4",i:2,q:"磁器・陶器・土器を焼成温度が高い順に並べると？",o:["磁器＞陶器＞土器","土器＞陶器＞磁器","陶器＞磁器＞土器","磁器＞土器＞陶器"],a:0,e:"磁器1300〜1500℃、陶器1100〜1300℃、土器700〜900℃。"},
// ---- u5
{u:"u5",i:3,q:"炎色反応で黄色を示す元素は？",o:["Na","K","Li","Ba"],a:0,e:"Li赤・Na黄・K赤紫・Cu青緑・Ca橙赤・Sr紅・Ba黄緑。"},
{u:"u5",i:3,q:"炎色反応が黄緑色の元素は？",o:["Ba","Sr","Ca","Cu"],a:0,e:"馬力＝Ba、黄緑色。Cuは青緑、Caは橙赤、Srは紅です。"},
{u:"u5",i:3,q:"アルカリ金属の単体の保存方法は？",o:["石油（灯油）中","水中","空気中","エタノール中だけ"],a:0,e:"水や酸素と反応しやすいので石油中に保存します。"},
{u:"u5",i:3,q:"アルカリ金属で、イオン化エネルギーが最も小さいのは？（Li・Na・Kのうち）",o:["K","Na","Li","全部同じ"],a:0,e:"原子番号が大きいほど最外殻電子が核から遠く、離れやすいのでイオン化エネルギーは小さくなります。"},
{u:"u5",i:3,q:"アンモニアソーダ法で、飽和食塩水にNH₃とCO₂を通したとき沈殿するのは？",o:["NaHCO₃","Na₂CO₃","NH₄Cl","NaOH"],a:0,e:"NaHCO₃は溶解度が小さいので沈殿します。これを加熱するとNa₂CO₃。"},
{u:"u5",i:3,q:"NaOHが空気中の水分を吸って溶ける現象は？",o:["潮解","風解","昇華","凝固"],a:0,e:"潮解。Na₂CO₃・10H₂Oが水和水を失って粉末になるのは風解です。"},
{u:"u5",i:3,q:"Na₂CO₃・10H₂Oを空気中に放置すると起こる現象は？",o:["風解","潮解","酸化","昇華"],a:0,e:"水和水の一部を失って Na₂CO₃・H₂O の白色粉末になります。"},
{u:"u5",i:3,q:"NaHCO₃を加熱したときに起こる変化は？",o:["Na₂CO₃・H₂O・CO₂に分解","変化しない","NaOHになる","Naが遊離"],a:0,e:"2NaHCO₃ → Na₂CO₃ ＋ H₂O ＋ CO₂。Na₂CO₃は加熱しても変化しません。"},
{u:"u5",i:3,q:"アルカリ土類金属に含まれないのは？",o:["Mg","Ca","Sr","Ba"],a:0,e:"アルカリ土類金属はCa・Sr・Ba・Ra。BeとMgは性質が異なり含みません。"},
{u:"u5",i:3,q:"生石灰CaOに水を加えて得られる物質は？",o:["消石灰Ca(OH)₂","CaCO₃","CaC₂","CaCl₂"],a:0,e:"CaO ＋ H₂O → Ca(OH)₂（発熱）。"},
{u:"u5",i:2,q:"カーバイドCaC₂に水を加えて発生する気体は？",o:["アセチレンC₂H₂","メタンCH₄","エチレンC₂H₄","H₂"],a:0,e:"CaC₂ ＋ 2H₂O → Ca(OH)₂ ＋ C₂H₂。"},
{u:"u5",i:2,q:"X線の造影剤に使われるのは？",o:["BaSO₄","CaSO₄","MgSO₄","BaCl₂"],a:0,e:"BaSO₄は水に溶けにくく、バリウムは有毒でも溶けないので安全に使えます。"},
{u:"u5",i:2,q:"Na₂CO₃とNaHCO₃を比べた記述で正しいものは？",o:["水への溶解度はNa₂CO₃の方が大きい","どちらも加熱で分解する","NaHCO₃水溶液は強塩基性","どちらも塩酸で気体を発生しない"],a:0,e:"溶解度はNa₂CO₃＞NaHCO₃。加熱で分解するのはNaHCO₃だけ。"},
// ---- u6
{u:"u6",i:3,q:"SO₄²⁻と白色沈殿をつくるイオンの組み合わせは？",o:["Ba²⁺・Ca²⁺・Pb²⁺","Ag⁺・Pb²⁺・Hg₂²⁺","Cu²⁺・Zn²⁺","Al³⁺・Fe³⁺"],a:0,e:"バカな竜さん：Ba・Ca・Pb ＋ 硫酸イオン。"},
{u:"u6",i:3,q:"Cl⁻と白色沈殿をつくるイオンの組み合わせは？",o:["Ag⁺・Pb²⁺・Hg₂²⁺","Ba²⁺・Ca²⁺","Cu²⁺・Zn²⁺","Na⁺・K⁺"],a:0,e:"AgCl・PbCl₂・Hg₂Cl₂。PbCl₂だけ熱湯に溶けます。"},
{u:"u6",i:3,q:"AgClとPbCl₂を区別するのに使う方法は？",o:["熱湯に加える","希硫酸を加える","NaOHを加える","炎色反応"],a:0,e:"PbCl₂は熱湯に溶け、AgClは溶けません。"},
{u:"u6",i:3,q:"硫化物のうち、白色の沈殿は？",o:["ZnS","CuS","FeS","SnS"],a:0,e:"ZnSだけ白。CuS・FeS・PbSなどは黒、SnSは褐、CdSは黄、MnSは淡赤。"},
{u:"u6",i:3,q:"酸性でもH₂Sで沈殿する金属イオンは？",o:["Cu²⁺","Zn²⁺","Fe²⁺","Ni²⁺"],a:0,e:"酸性でも沈殿：Sn・Pb・Cu・Hg・Ag。Zn・Fe・Niは中性・塩基性でだけ沈殿。"},
{u:"u6",i:3,q:"両性金属のイオンの組み合わせは？",o:["Al³⁺・Zn²⁺・Sn²⁺・Pb²⁺","Cu²⁺・Ag⁺・Zn²⁺","Fe²⁺・Fe³⁺","Ba²⁺・Ca²⁺"],a:0,e:"ああすんなりと両性に愛される：Al・Zn・Sn・Pb。過剰のNaOHで溶けます。"},
{u:"u6",i:3,q:"過剰のNH₃水を加えると溶ける沈殿をつくるイオンは？",o:["Cu²⁺・Ag⁺・Zn²⁺","Al³⁺・Fe³⁺","Pb²⁺・Sn²⁺","Ba²⁺・Ca²⁺"],a:0,e:"アンモニアはどぎゃん：Cu・Ag・Zn。錯イオンになって溶けます。"},
{u:"u6",i:3,q:"AgI（黄色沈殿）について正しいものは？",o:["NH₃水に溶けないが、Na₂S₂O₃水溶液には溶ける","NH₃水にもNa₂S₂O₃にも溶けない","NH₃水に溶ける","水によく溶ける"],a:0,e:"AgClとAgBrはNH₃水に溶けますが、AgIは溶けません。ただし3つともNa₂S₂O₃には溶けます。"},
{u:"u6",i:3,q:"CrO₄²⁻を加えて赤色沈殿を生じるイオンは？",o:["Ag⁺","Ba²⁺","Pb²⁺","Ca²⁺"],a:0,e:"Ag₂CrO₄は赤、BaCrO₄・PbCrO₄は黄色です。"},
{u:"u6",i:3,q:"Pt・Auを溶かすことができる液体は？",o:["王水","濃硝酸","熱濃硫酸","濃塩酸"],a:0,e:"王水＝濃塩酸：濃硝酸＝3：1。"},
{u:"u6",i:2,q:"Pbが希硫酸に溶けにくい理由は？",o:["PbSO₄の被膜ができるから","Pbはイオン化傾向がHより小さいから","酸化被膜ができるから","PbSO₄が気体になるから"],a:0,e:"Pbはイオン化傾向がHより大きいのですが、PbSO₄（PbCl₂）の白い膜が表面を覆って溶けにくくなります。"},
// ---- u7
{u:"u7",i:3,q:"Fe³⁺の水溶液にKSCNを加えると？",o:["血赤色になる","濃青色沈殿","白色沈殿","変化なし"],a:0,e:"Fe³⁺ ＋ SCN⁻ → 血赤色。Fe²⁺では変化しません。"},
{u:"u7",i:3,q:"Fe²⁺にK₃[Fe(CN)₆]を加えたときの変化は？",o:["濃青色沈殿","血赤色","白色沈殿","変化なし"],a:0,e:"ターンブル青。Fe³⁺にK₄[Fe(CN)₆]を加えるとベルリンブルー（どちらも濃青色）。"},
{u:"u7",i:3,q:"Fe₃O₄について正しいものは？",o:["黒色で強い磁性をもつ","赤褐色でベンガラと呼ばれる","白色","淡緑色"],a:0,e:"Fe₃O₄は四酸化三鉄（磁鉄鉱・黒さび）。ベンガラはFe₂O₃。"},
{u:"u7",i:3,q:"Cu(OH)₂の沈殿の色と、加熱後の物質は？",o:["青白色・CuO（黒）","白色・CuO（黒）","青白色・Cu₂O（赤）","褐色・Ag₂O"],a:0,e:"Cu(OH)₂（青白）→加熱→CuO（黒）＋H₂O。"},
{u:"u7",i:3,q:"過剰のNH₃水で生じる[Cu(NH₃)₄]²⁺の色は？",o:["深青","無色","淡緑","赤紫"],a:0,e:"テトラアンミン銅(Ⅱ)イオンは深青色です。"},
{u:"u7",i:3,q:"硫酸酸性でKMnO₄が酸化剤としてはたらくとき、赤紫色はどうなる？",o:["淡赤色（ほぼ無色）のMn²⁺になる","黒色のMnO₂になる","黄色になる","変化しない"],a:0,e:"酸性ではMnO₄⁻ → Mn²⁺。中性・塩基性ではMnO₂（黒）になります。"},
{u:"u7",i:3,q:"K₂CrO₄水溶液に酸を加えると色はどう変わる？",o:["黄 → 橙赤","橙赤 → 黄","黄 → 緑","無色 → 黄"],a:0,e:"2CrO₄²⁻ ＋ 2H⁺ → Cr₂O₇²⁻ ＋ H₂O。塩基を加えると逆に黄色に戻ります。"},
{u:"u7",i:3,q:"酸性でCr₂O₇²⁻が酸化剤としてはたらくと、何色の溶液になる？",o:["薄緑（Cr³⁺）","黄（CrO₄²⁻）","赤紫","無色"],a:0,e:"Cr₂O₇²⁻ ＋ 14H⁺ ＋ 6e⁻ → 2Cr³⁺ ＋ 7H₂O。橙赤 → 薄緑。"},
// ---- u8
{u:"u8",i:3,q:"上方置換で捕集する気体は？",o:["NH₃","Cl₂","NO","CO₂"],a:0,e:"空気より軽く水に溶けやすいNH₃だけが上方置換です。"},
{u:"u8",i:3,q:"水上置換で捕集できない気体は？",o:["NH₃","H₂","NO","CO"],a:0,e:"NH₃は水に非常に溶けやすいので水上置換は使えません。"},
{u:"u8",i:3,q:"下方置換で捕集する気体の組み合わせは？",o:["Cl₂・SO₂・NO₂","H₂・O₂・NO","NH₃・H₂","N₂・CO"],a:0,e:"水に溶けやすく空気より重い気体は下方置換。水に溶けにくいものは水上置換。"},
{u:"u8",i:3,q:"濃硫酸と十酸化四リンの両方で乾燥できない気体は？",o:["NH₃","CO₂","Cl₂","SO₂"],a:0,e:"どちらも酸性乾燥剤なので、塩基性のNH₃は中和されて使えません。"},
{u:"u8",i:3,q:"ソーダ石灰で乾燥できる気体は？",o:["NH₃","Cl₂","CO₂","HCl"],a:0,e:"ソーダ石灰は塩基性。酸性の気体（Cl₂・CO₂・HClなど）は中和されてしまいます。"},
{u:"u8",i:3,q:"弱酸遊離反応で発生する気体の組み合わせは？",o:["CO₂・SO₂・H₂S","Cl₂・NO₂・NO","H₂・O₂・N₂","HCl・HF・HNO₃"],a:0,e:"弱酸の塩 ＋ 強酸：CaCO₃→CO₂、Na₂SO₃→SO₂、FeS→H₂S。HCl・HFは揮発性の酸の遊離です。"},
{u:"u8",i:3,q:"加熱が必要な発生法はどれ？",o:["MnO₂ ＋ 濃塩酸 → Cl₂","FeS ＋ 希硫酸 → H₂S","CaCO₃ ＋ 希塩酸 → CO₂","Zn ＋ 希硫酸 → H₂"],a:0,e:"キップの装置で加熱なしに発生できるのは固体＋希酸のもの。MnO₂＋濃塩酸は加熱が必要です。"},
{u:"u8",i:2,q:"赤褐色の気体は？",o:["NO₂","Cl₂","F₂","O₃"],a:0,e:"NO₂：赤褐色、Cl₂：黄緑、F₂：淡黄、O₃：淡青。"},
{u:"u8",i:2,q:"CO₂に混ざったHClを取り除くために通す液体は？",o:["NaHCO₃水溶液","濃硫酸","水酸化ナトリウム水溶液","石灰水"],a:0,e:"HClだけを吸収し、CO₂は発生させます。NaOH・石灰水はCO₂も吸収してしまいます。"}

{u:"u6",i:3,q:"硫酸塩が水に溶けにくい（沈殿する）ものの組み合わせは？",o:["BaSO₄・CaSO₄・PbSO₄","MgSO₄・BaSO₄","Na₂SO₄・CaSO₄","CuSO₄・PbSO₄"],a:0,e:"MgSO₄・Na₂SO₄・CuSO₄は水に溶けます。"},
{u:"u6",i:3,q:"BaSO₄とBaCO₃を区別するために加える試薬は？",o:["希塩酸","水","NaOH水溶液","KI水溶液"],a:0,e:"BaCO₃は希塩酸に溶けてCO₂を出しますが、BaSO₄は希塩酸にも溶けません。"},
{u:"u6",i:3,q:"Ba²⁺とCa²⁺を区別できる方法は？（Ba²⁺だけが沈殿する）",o:["K₂CrO₄水溶液を加える","希塩酸を加える","NaOH水溶液を加える","H₂Sを通す"],a:0,e:"BaCrO₄は黄色沈殿ですが、Ca²⁺は沈殿しません。炎色反応（Ba黄緑・Ca橙赤）でも区別できます。"},
{u:"u6",i:3,q:"Pb²⁺を確認するのに最も適した試薬は？",o:["K₂CrO₄水溶液（黄色PbCrO₄）","KSCN（血赤色）","K₄[Fe(CN)₆]（濃青）","NH₃水（深青）"],a:0,e:"Pb²⁺＋CrO₄²⁻ → PbCrO₄ の黄色沈殿。"},
{u:"u6",i:3,q:"Ag⁺にCrO₄²⁻を加えたときの沈殿の色は？",o:["赤","黄","白","黒"],a:0,e:"Ag₂CrO₄は赤色（赤い銀貨）。Ba・Pbは黄色です。"},
{u:"u6",i:2,q:"Pb²⁺が沈殿をつくらない陰イオンは？",o:["NO₃⁻","Cl⁻","SO₄²⁻","CrO₄²⁻"],a:0,e:"硝酸塩は一般にすべて水に溶けます。PbCl₂・PbSO₄・PbCrO₄・PbS はいずれも沈殿します。"},
// ===== 沈殿：Cl⁻・AgX =====
{u:"u6",i:3,q:"AgClとPbCl₂の混合物に熱湯を加えてろ過した。ろ液に溶けているのは？",o:["Pb²⁺（PbCl₂）","Ag⁺（AgCl）","どちらも溶けている","どちらも溶けない"],a:0,e:"PbCl₂は熱湯に溶けますが、AgClは溶けません。"},
{u:"u6",i:3,q:"AgClの沈殿に過剰のNH₃水を加えると？",o:["溶けて無色の[Ag(NH₃)₂]⁺になる","溶けて深青色になる","黒くなる","変化しない"],a:0,e:"AgCl ＋ 2NH₃ → [Ag(NH₃)₂]⁺ ＋ Cl⁻。ジアンミン銀(Ⅰ)イオンは無色。"},
{u:"u6",i:3,q:"AgCl・AgBr・AgIをすべて溶かせる水溶液は？",o:["Na₂S₂O₃水溶液","NH₃水","希硝酸","希塩酸"],a:0,e:"チオ硫酸ナトリウムは3つとも溶かして[Ag(S₂O₃)₂]³⁻（無色）になります。"},
{u:"u6",i:3,q:"NH₃水を過剰に加えても溶けないハロゲン化銀は？",o:["AgI","AgCl","AgBr","どれも溶ける"],a:0,e:"AgIだけはNH₃水に溶けません。"},
{u:"u6",i:3,q:"Cl⁻を含む水溶液にAgNO₃水溶液を加えると生じる沈殿は？",o:["AgCl（白）","AgCl（淡黄）","AgCl（黄）","Ag₂O（褐）"],a:0,e:"白色のAgClが沈殿します。光に当てると黒くなります（感光性）。"},
// ===== 沈殿：硫化物 =====
{u:"u6",i:3,q:"酸性の溶液にH₂Sを通しても沈殿しないイオンは？",o:["Zn²⁺","Cu²⁺","Pb²⁺","Ag⁺"],a:0,e:"Zn・Fe・Niは中性・塩基性でだけ硫化物が沈殿します（酸性ではS²⁻が少なすぎる）。"},
{u:"u6",i:3,q:"酸性の混合溶液（Cu²⁺・Zn²⁺・Fe²⁺）にH₂Sを通すと沈殿するのは？",o:["CuS（黒）だけ","CuSとZnS","CuSとFeS","3つとも"],a:0,e:"酸性で沈殿するのはCuのみ。ZnとFeは塩基性にしてから沈殿します。"},
{u:"u6",i:3,q:"硫化物の色の組み合わせで正しいものは？",o:["ZnS＝白・CdS＝黄・MnS＝淡赤","ZnS＝黒・CdS＝黄・MnS＝白","ZnS＝白・CdS＝黒・MnS＝黄","ZnS＝黄・CdS＝白・MnS＝黒"],a:0,e:"ZnSは白、CdSは黄（カドミウムイエロー）、MnSは淡赤。ほかのCuS・FeS・PbS・Ag₂Sは黒。"},
{u:"u6",i:3,q:"黒色の沈殿を生じないのは？（硫化物）",o:["Zn²⁺ ＋ S²⁻","Cu²⁺ ＋ S²⁻","Pb²⁺ ＋ S²⁻","Ag⁺ ＋ S²⁻"],a:0,e:"ZnSは白色。ほかは黒色です。"},
{u:"u6",i:3,q:"褐色の硫化物沈殿をつくるのは？",o:["Sn²⁺","Zn²⁺","Cd²⁺","Mn²⁺"],a:0,e:"SnSは褐色。"},
{u:"u6",i:3,q:"混合溶液（Cu²⁺・Zn²⁺）に、先に酸性でH₂Sを通してろ過し、そのろ液を塩基性にしてH₂Sを通すと、新たに沈殿するのは？",o:["ZnS（白）","CuS（黒）","FeS（黒）","沈殿しない"],a:0,e:"酸性でCuSが沈殿して除かれ、塩基性にするとZnSが白色沈殿します。"},
{u:"u6",i:2,q:"H₂Sで沈殿をつくる金属のうち、液性を問わず沈殿するものの組み合わせは？",o:["Cu・Hg・Ag・Pb・Sn","Zn・Fe・Ni","Al・Ca・Ba","Na・K・Mg"],a:0,e:"Cu・Hg・Ag・Pb・Snは液性に関係なく沈殿。Zn・Fe・Niは中性・塩基性のみ。Al・Ca・Ba・Na・K・Mgはそもそも硫化物が沈殿しません。"},
// ===== 沈殿：OH⁻・NH₃・両性 =====
{u:"u6",i:3,q:"Al³⁺にNaOH水溶液を少しずつ加え続けたときの変化は？",o:["白色沈殿ができ、過剰で溶ける","白色沈殿ができ、過剰でも溶けない","青白色沈殿ができ、過剰で溶ける","沈殿はできない"],a:0,e:"Al(OH)₃は両性水酸化物なので、過剰のNaOHで[Al(OH)₄]⁻となって溶けます。"},
{u:"u6",i:3,q:"Al³⁺とZn²⁺を含む溶液に過剰のNH₃水を加えると？",o:["Zn²⁺は溶けるが、Al(OH)₃は溶けずに沈殿が残る","どちらも溶ける","どちらも溶けずに残る","Al³⁺だけ溶ける"],a:0,e:"AlはNH₃水の過剰では溶けません。Znは錯イオン[Zn(NH₃)₄]²⁺をつくって溶けます。"},
{u:"u6",i:3,q:"Zn²⁺に少量のNaOH水溶液を加えると生じる沈殿は？",o:["Zn(OH)₂（白）","ZnO（黒）","ZnS（白）","Zn(OH)₂（青白）"],a:0,e:"Zn(OH)₂は白色。過剰のNaOHやNH₃水で溶けます。"},
{u:"u6",i:3,q:"過剰のNaOH水溶液を加えても溶けない沈殿は？",o:["Fe(OH)₃","Al(OH)₃","Zn(OH)₂","Pb(OH)₂"],a:0,e:"両性金属（Al・Zn・Sn・Pb）の水酸化物は溶けますが、Fe(OH)₃は溶けません。"},
{u:"u6",i:3,q:"Al³⁺・Zn²⁺・Fe³⁺の混合溶液に過剰のNaOH水溶液を加えてろ過した。沈殿として残るのは？",o:["Fe(OH)₃（赤褐色）","Al(OH)₃（白）","Zn(OH)₂（白）","何も残らない"],a:0,e:"AlとZnは[Al(OH)₄]⁻・[Zn(OH)₄]²⁻としてろ液に溶け、Fe(OH)₃だけが残ります。"},
{u:"u6",i:3,q:"Cu²⁺・Fe³⁺・Zn²⁺の混合溶液に過剰のNH₃水を加えると、沈殿として残るのは？",o:["Fe(OH)₃","Cu(OH)₂","Zn(OH)₂","何も残らない"],a:0,e:"CuとZnは錯イオンになって溶け、Fe(OH)₃は溶けずに残ります。"},
{u:"u6",i:3,q:"Ag⁺・Cu²⁺・Zn²⁺の混合溶液に過剰のNH₃水を加えると？",o:["すべて錯イオンになって溶ける","Ag₂Oだけ沈殿が残る","Cu(OH)₂だけ沈殿が残る","Zn(OH)₂だけ沈殿が残る"],a:0,e:"アンモニアはどぎゃん：Cu・Ag・Znは、どれも過剰のNH₃水に溶けます。"},
{u:"u6",i:3,q:"Ag⁺にNH₃水を少し加えたときの沈殿は？",o:["Ag₂O（褐）","AgOH（白）","Ag₂S（黒）","AgCl（白）"],a:0,e:"AgOHは不安定で、すぐにAg₂O（褐色）になります。"},
{u:"u6",i:3,q:"Cu²⁺にNH₃水を少量加えると青白色沈殿ができ、過剰に加えると深青色の溶液になる。この錯イオンは？",o:["[Cu(NH₃)₄]²⁺","[Cu(OH)₄]²⁻","[Cu(NH₃)₂]⁺","[CuCl₄]²⁻"],a:0,e:"テトラアンミン銅(Ⅱ)イオン。深青色です。"},
{u:"u6",i:2,q:"[Ag(NH₃)₂]⁺の名称と配位数の組み合わせは？",o:["ジアンミン銀(Ⅰ)イオン・2","テトラアンミン銀(Ⅰ)イオン・4","ジアンミン銀(Ⅱ)イオン・2","ジアンミン銀(Ⅰ)イオン・4"],a:0,e:"ジ（2）アンミン（NH₃）銀(Ⅰ)。NH₃が2個配位しています。"},
{u:"u6",i:2,q:"[Zn(NH₃)₄]²⁺の色は？",o:["無色","深青","淡緑","赤紫"],a:0,e:"Zn²⁺は無色のイオンなので、錯イオンも無色です。"},
{u:"u6",i:2,q:"両性水酸化物をつくる金属の組み合わせは？",o:["Al・Zn・Sn・Pb","Cu・Ag・Zn","Ca・Ba・Mg","Fe・Ni・Co"],a:0,e:"ああすんなりと両性に愛される：Al・Zn・Sn・Pb。"},
// ===== 分離の流れ =====
{u:"u6",i:3,q:"Ag⁺・Cu²⁺・Fe³⁺の混合溶液に希塩酸を加えると、沈殿するのは？",o:["AgCl（白）","CuCl₂（青）","FeCl₃（黄褐）","沈殿しない"],a:0,e:"塩化物で沈殿するのはAgだけ（この3種の中では）。ろ液にはCu²⁺・Fe³⁺が残ります。"},
{u:"u6",i:3,q:"Ag⁺・Cu²⁺・Fe³⁺の混合溶液に希塩酸を加えて沈殿を除き、ろ液にH₂Sを通すと沈殿するのは？",o:["CuS（黒）","FeS（黒）","Fe(OH)₃（赤褐）","AgCl（白）"],a:0,e:"酸性でもH₂Sで沈殿するのはCu。Feは酸性では沈殿しません。"},
{u:"u6",i:3,q:"H₂Sを通した後のろ液を加熱して、希硝酸を少量加える目的は？",o:["H₂Sで還元されたFe²⁺を、Fe³⁺にもどすため","Cu²⁺を沈殿させるため","溶液を塩基性にするため","Ag⁺を沈殿させるため"],a:0,e:"H₂Sは還元剤なのでFe³⁺がFe²⁺になっています。硝酸（酸化剤）でFe³⁺にもどします。"},
{u:"u6",i:3,q:"Fe³⁺を含む水溶液にNH₃水を加えると生じる沈殿の色は？",o:["赤褐色","白色","青白色","濃青色"],a:0,e:"Fe(OH)₃は赤褐色の沈殿。過剰のNH₃水でも溶けません。"},
{u:"u6",i:3,q:"Ca²⁺を含む水溶液に、炭酸ナトリウム水溶液を加えたときの沈殿と色は？",o:["CaCO₃・白","CaCO₃・黄","Ca(OH)₂・青白","沈殿しない"],a:0,e:"炭酸塩の沈殿はバカ炭酸（Ba・Ca）。白色です。"},
// ===== 金属の溶解 =====
{u:"u6",i:3,q:"希塩酸に溶けない金属は？",o:["Cu","Zn","Fe","Mg"],a:0,e:"Cuはイオン化傾向がHより小さいので、希塩酸・希硫酸には溶けません。酸化力のある酸に溶けます。"},
{u:"u6",i:3,q:"希硝酸にも濃硝酸にも溶ける金属は？",o:["Cu","Al","Fe","Au"],a:0,e:"AlとFeは濃硝酸で不動態、Auは王水だけです。Cuは両方に溶けます。"},
{u:"u6",i:3,q:"王水にしか溶けない金属の組み合わせは？",o:["Pt・Au","Cu・Ag","Hg・Ag","Zn・Fe"],a:0,e:"Pt・Auは、酸化力のある酸（硝酸・熱濃硫酸）にも溶けず、王水に溶けます。"},
{u:"u6",i:2,q:"常温の水と反応して水素を発生する金属の組み合わせは？",o:["K・Ca・Na","Mg・Al・Zn","Fe・Ni・Sn","Cu・Hg・Ag"],a:0,e:"常温の水と反応するのはK・Ca・Na。Mgは熱水、Al・Zn・Feは高温の水蒸気。"},
{u:"u6",i:2,q:"Ag は次のうちどれに溶ける？",o:["希硝酸","希塩酸","希硫酸","水"],a:0,e:"AgはCuと同様、酸化力のある酸（希硝酸・濃硝酸・熱濃硫酸）に溶けます。"},
// ===== 遷移元素・検出 =====
{u:"u7",i:3,q:"Fe³⁺とFe²⁺を見分けられる試薬は？",o:["KSCN水溶液（Fe³⁺で血赤色）","NaCl水溶液","希塩酸","NaNO₃水溶液"],a:0,e:"Fe³⁺は血赤色になりますが、Fe²⁺は変化しません。"},
{u:"u7",i:3,q:"K₄[Fe(CN)₆]を加えたとき、濃青色沈殿を生じるのは？",o:["Fe³⁺","Fe²⁺","Cu²⁺","Zn²⁺"],a:0,e:"Fe³⁺＋K₄[Fe(CN)₆]：ベルリンブルー。Fe²⁺＋K₃[Fe(CN)₆]：ターンブル青。"},
{u:"u7",i:3,q:"K₃[Fe(CN)₆]を加えたとき、濃青色沈殿を生じるのは？",o:["Fe²⁺","Fe³⁺","Ag⁺","Ba²⁺"],a:0,e:"赤血カリK₃[Fe(CN)₆]はFe²⁺と濃青色沈殿（ターンブル青）。"},
{u:"u7",i:3,q:"Mn²⁺を含む水溶液を塩基性にしてH₂Sを通すと？",o:["MnS（淡赤）が沈殿する","MnS（黒）が沈殿する","沈殿しない","MnO₂が沈殿する"],a:0,e:"MnSは淡赤色の沈殿です。"},
{u:"u7",i:3,q:"Cr₂O₇²⁻（橙赤色）の水溶液にNaOH水溶液を加えると？",o:["黄色（CrO₄²⁻）になる","緑色になる","無色になる","赤紫色になる"],a:0,e:"Cr₂O₇²⁻ ＋ 2OH⁻ → 2CrO₄²⁻ ＋ H₂O。酸を加えると橙赤にもどります。"},
{u:"u7",i:3,q:"Cu(OH)₂の青白色沈殿を加熱したときに生じる黒色の物質は？",o:["CuO","Cu₂O","CuS","Cu"],a:0,e:"Cu(OH)₂ → CuO ＋ H₂O。"},
{u:"u7",i:2,q:"Fe(OH)₂について正しいものは？",o:["酸化されやすく、Fe(OH)₃に変わる","安定で空気中でも変化しない","赤褐色の沈殿","過剰のNaOHで溶ける"],a:0,e:"Fe(OH)₂は空気中で酸化されて、赤褐色のFe(OH)₃になります。"},
// ===== 2族・炎色 =====
{u:"u5",i:3,q:"炎色反応で赤紫色を示すのは？（Li・K・Srのうち）",o:["K","Li","Sr","どれも違う"],a:0,e:"Kは赤紫、Liは赤、Srは紅（深赤）。"},
{u:"u5",i:3,q:"Ca²⁺・Ba²⁺・Cu²⁺を炎色反応で区別するとき、それぞれの色の組み合わせは？",o:["橙赤・黄緑・青緑","黄緑・橙赤・青緑","青緑・橙赤・黄緑","黄・黄緑・青緑"],a:0,e:"Ca＝橙赤、Ba＝黄緑、Cu＝青緑。"},
{u:"u5",i:3,q:"硫酸塩が水に溶けるのはどれ？",o:["MgSO₄","CaSO₄","BaSO₄","SrSO₄"],a:0,e:"BeとMgの硫酸塩は水に溶け、Ca・Sr・Baの硫酸塩は溶けにくい（白色沈殿）。"},
{u:"u5",i:2,q:"BaSO₄について誤りは？",o:["水によく溶ける","白色である","X線の造影剤に使われる","希塩酸にも溶けない"],a:0,e:"BaSO₄は水に溶けにくい白色の物質です。"}

  var tot=0,k=0;

  return {tot:tot,k:k,pct:tot?Math.round(k*100/tot):0};
}

function viewCards(m,arg){
  arg=arg||{};
  if(arg.mode==="today"){startCards(m,todayDeck(),"今日の10枚");return;}
  var cfg={u:arg.u||"all",imp:"3",only:"new"};
  function setup(){
    var h='<h1 class="pg">🃏 暗記カード</h1><p class="lead">赤字の穴をタップして答えを出し、「覚えた」か「まだ」を選びます。「まだ」のカードは後でもう一度出ます。</p><h2 class="sec">単元</h2>'+unitChips(cfg.u,null,true)+'<h2 class="sec">重要度</h2><div class="chips" id="imps">'+[["3","★★★ だけ"],["2","★★ 以上"],["1","ぜんぶ"]].map(function(x){return '<button class="chip'+(cfg.imp===x[0]?" on":"")+'" data-i="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div><h2 class="sec">対象</h2><div class="chips" id="onlys">'+[["new","まだ覚えていないもの"],["all","覚えたものも含める"]].map(function(x){return '<button class="chip'+(cfg.only===x[0]?" on":"")+'" data-o="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>';
    var d=buildDeck(cfg);
    h+='<div class="btnrow center"><button class="btn primary big" id="start" '+(d.length?"":"disabled")+'>'+(d.length?d.length+"枚で始める":"対象のカードがありません")+'</button></div><div class="btnrow center"><button class="btn" id="t10">今日の10枚（おまかせ）</button></div>';
    m.innerHTML=h;
    Array.prototype.forEach.call(m.querySelectorAll(".chips .chip[data-u]"),function(b){b.onclick=function(){cfg.u=b.getAttribute("data-u");setup();};});
    Array.prototype.forEach.call(m.querySelectorAll("#imps .chip"),function(b){b.onclick=function(){cfg.imp=b.getAttribute("data-i");setup();};});
    Array.prototype.forEach.call(m.querySelectorAll("#onlys .chip"),function(b){b.onclick=function(){cfg.only=b.getAttribute("data-o");setup();};});
    var st=$("#start");if(st)st.onclick=function(){startCards(m,d,"カード");};
    $("#t10").onclick=function(){startCards(m,todayDeck(),"今日の10枚");};
  }

function buildDeck(cfg){
  var minI=parseInt(cfg.imp,10);
  var d=ALL.filter(function(p){return (cfg.u==="all"||p.u===cfg.u)&&p.i>=minI&&(cfg.only==="all"||!known(p.id));});
  return shuffle(d).sort(function(a,b){return b.i-a.i;}).slice(0,40);
}
function todayDeck(){
  var sc=ALL.map(function(p){return {p:p,s:p.i*2+(3-Math.min(3,getBox(p.id)))*2+Math.random()*2.5-(known(p.id)?3:0)};});
  sc.sort(function(a,b){return b.s-a.s;});
  return sc.slice(0,10).map(function(x){return x.p;});
}
function startCards(m,deck,title){
  var queue=deck.slice(),total=queue.length,done=0,okN=0,requeued={};
  if(!total){m.innerHTML='<p class="lead">カードがありません。</p>';return;}
  function show(){
    if(!queue.length){finish();return;}
    var p=queue[0],u=UMAP[p.u];
    var h='<div class="cprog"><div class="track"><div class="fill" style="width:'+Math.round(done*100/total)+'%"></div></div><span>'+done+' / '+total+'</span></div><div class="fcard" style="--c:'+u.color+'"><div class="fmeta"><span class="fu">'+u.icon+" "+u.name.replace(/（.*$/,"")+'</span>'+stars(p.i)+'</div><div class="fbody hidecz">'+cz(p.t,true)+'</div><div class="fhint">赤い□をタップすると答えが出ます</div></div><div class="btnrow center" id="act"><button class="btn primary big" id="rv">答えを全部見る</button></div>';
    m.innerHTML=h;
    $("#rv").onclick=function(){
      Array.prototype.forEach.call(m.querySelectorAll(".cz"),function(c){c.classList.add("open");});
      $("#act").innerHTML='<button class="btn big" id="no">😣 まだ</button><button class="btn primary big" id="yes">😊 覚えた</button>';
      $("#no").onclick=function(){S.box[p.id]=0;save();queue.shift();if(!requeued[p.id]){requeued[p.id]=1;queue.push(p);}else{done++;}show();};
      $("#yes").onclick=function(){S.box[p.id]=Math.min(3,getBox(p.id)+(getBox(p.id)<1?2:1));save();queue.shift();done++;okN++;show();};
    };
  }
  function finish(){
    var pct=Math.round(okN*100/total);
    var msg=pct>=80?"すばらしい！ この調子です。":pct>=50?"いいペースです。「まだ」のものは、また出てきます。":"ここまで来たことが一歩目です。くり返せば必ず覚えられます。";
    m.innerHTML='<section class="done"><div class="big-emoji">'+(pct>=80?"🎉":"🌱")+'</div><h1>'+title+' おつかれさま！</h1><p class="lead">一度で「覚えた」にできたのは <b>'+okN+' / '+total+'</b> 枚。<br>'+msg+'</p><div class="btnrow center"><button class="btn primary" id="again">もう一度（おまかせ10枚）</button><button class="btn" id="home">ホームへ</button></div></section>';
    if(pct>=60)burst();
    $("#again").onclick=function(){startCards(m,todayDeck(),"今日の10枚");};
    $("#home").onclick=function(){go("home");};
  }
  show();
}
function burst(){
  var c=el('<div class="confetti"></div>');var em=["🌸","✨","⭐","🎈","🧪"];
  for(var i=0;i<22;i++){var s=document.createElement("span");s.textContent=em[i%em.length];s.style.left=(Math.random()*100)+"%";s.style.animationDelay=(Math.random()*0.8)+"s";s.style.fontSize=(16+Math.random()*16)+"px";c.appendChild(s);}
  document.body.appendChild(c);setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},3600);
}

function startQuiz(m,qs,title){
  if(!qs.length){m.innerHTML='<p class="lead">問題がありません。</p><div class="btnrow center"><button class="btn" id="b">もどる</button></div>';$("#b").onclick=function(){go("quiz");};return;}
  var idx=0,score=0,miss=[];
  function show(){
    if(idx>=qs.length){finish();return;}
    var q=qs[idx],u=UMAP[q.u];
    var order=shuffle(q.o.map(function(t,i){return {t:t,c:i===q.a};}));
    var h='<div class="cprog"><div class="track"><div class="fill" style="width:'+Math.round(idx*100/qs.length)+'%"></div></div><span>'+(idx+1)+' / '+qs.length+'</span></div><div class="qcard" style="--c:'+u.color+'"><div class="fmeta"><span class="fu">'+u.icon+" "+u.name.replace(/（.*$/,"")+'</span>'+stars(q.i)+'</div><div class="qq">'+q.q+'</div>'+(q.img?'<img class="qimg" src="'+q.img+'" alt="図">':'')+'<div class="opts">'+order.map(function(o,i){return '<button class="opt" data-c="'+(o.c?1:0)+'"><span class="ol">'+"ABCD"[i]+'</span><span>'+o.t+'</span></button>';}).join("")+'</div><div id="fb"></div></div>';
    m.innerHTML=h;
    var done=false;
    Array.prototype.forEach.call(m.querySelectorAll(".opt"),function(b){b.onclick=function(){
      if(done)return;done=true;
      var right=b.getAttribute("data-c")==="1";
      Array.prototype.forEach.call(m.querySelectorAll(".opt"),function(x){if(x.getAttribute("data-c")==="1")x.classList.add("right");x.disabled=true;});
      if(!right){b.classList.add("wrong");}
      if(right){score++;delete S.wrong[q.id];}else{S.wrong[q.id]=1;miss.push(q);}
      save();
      $("#fb").innerHTML='<div class="fb '+(right?"ok":"ng")+'"><b>'+(right?"⭕ 正解！":"❌ おしい！")+'</b><p>'+q.e+'</p>'+(q.eimg?'<img class="qimg" src="'+q.eimg+'" alt="答えの図">':'')+'</div><div class="btnrow center"><button class="btn primary" id="nx">'+(idx+1>=qs.length?"結果を見る":"次の問題へ")+'</button></div>';
      $("#nx").onclick=function(){idx++;show();};
      $("#nx").focus();
    };});
  }
  function finish(){
    var pct=Math.round(score*100/qs.length);
    var h='<section class="done"><div class="big-emoji">'+(pct>=80?"🎉":pct>=50?"👍":"🌱")+'</div><h1>'+title+' けっか</h1><div class="score">'+score+' <small>/ '+qs.length+'</small></div><p class="lead">'+(pct>=80?"とてもよくできました！":pct>=50?"半分以上できています。まちがえたところを見直しましょう。":"まちがえたところが「伸びしろ」です。解説を読んで、もう一度やってみましょう。")+'</p>';
    if(miss.length){h+='<div class="review"><h2>見直し</h2>'+miss.map(function(q){return '<div class="rv"><div class="rq">'+q.q+'</div>'+(q.img?'<img class="qimg" src="'+q.img+'" alt="図">':'')+'<div class="ra">答え：<b>'+q.o[q.a]+'</b></div><div class="re">'+q.e+'</div>'+(q.eimg?'<img class="qimg" src="'+q.eimg+'" alt="答えの図">':'')+'</div>';}).join("")+'</div>';}
    h+='<div class="btnrow center">'+(miss.length?'<button class="btn primary" id="retry">まちがえた問題をもう一度</button>':"")+'<button class="btn" id="new">別の問題をやる</button><button class="btn" id="home">ホームへ</button></div></section>';
    m.innerHTML=h;
    if(pct>=70)burst();
    var r=$("#retry");if(r)r.onclick=function(){startQuiz(m,shuffle(miss),"まちがえた問題");};
    $("#new").onclick=function(){go("quiz");};
    $("#home").onclick=function(){go("home");};
  }
  show();
}

      var pool=COLORS.filter(function(c){return cur==="ぜんぶ"||c.c===cur;});
      pool=shuffle(pool).sort(function(a,b){return b.i-a.i+(Math.random()-.5)*1.6;}).slice(0,10);
      startColor(m,pool,cur);};
  }
  setup();
}
function startColor(m,qs,cat){
  var idx=0,score=0;
  function show(){
    if(idx>=qs.length){finish();return;}
    var q=qs[idx];
    var ans=PMAP[q.a];
    var others=shuffle(PALETTE.filter(function(p){return p.id!==q.a&&p.id!=="none";})).slice(0,3);
    var opts=shuffle([ans].concat(others));
    var h='<div class="cprog"><div class="track"><div class="fill" style="width:'+Math.round(idx*100/qs.length)+'%"></div></div><span>'+(idx+1)+' / '+qs.length+'</span></div><div class="qcard"><div class="fmeta"><span class="fu">'+q.c+'</span>'+stars(q.i)+'</div><div class="qq big">'+q.q+'</div><div class="qsub">この色は？</div><div class="copts">'+opts.map(function(o){return '<button class="copt" data-id="'+o.id+'"><span class="dot lg" style="background:'+o.h+'"></span><span>'+o.n+'</span></button>';}).join("")+'</div><div id="fb"></div></div>';
    m.innerHTML=h;
    var done=false;
    Array.prototype.forEach.call(m.querySelectorAll(".copt"),function(b){b.onclick=function(){
      if(done)return;done=true;
      var right=b.getAttribute("data-id")===q.a;
      Array.prototype.forEach.call(m.querySelectorAll(".copt"),function(x){if(x.getAttribute("data-id")===q.a)x.classList.add("right");x.disabled=true;});
      if(!right)b.classList.add("wrong");else score++;
      $("#fb").innerHTML='<div class="fb '+(right?"ok":"ng")+'"><b>'+(right?"⭕ 正解！":"❌ 正解は「"+ans.n+"」")+'</b><p>'+q.e+'</p></div><div class="btnrow center"><button class="btn primary" id="nx">'+(idx+1>=qs.length?"結果を見る":"次へ")+'</button></div>';
      $("#nx").onclick=function(){idx++;show();};$("#nx").focus();
    };});
  }
  function finish(){
    var pct=Math.round(score*100/qs.length);
    m.innerHTML='<section class="done"><div class="big-emoji">'+(pct>=80?"🌈":"🎨")+'</div><h1>色ドリル けっか</h1><div class="score">'+score+' <small>/ '+qs.length+'</small></div><p class="lead">'+(pct>=80?"色がバッチリ入っています！":"まちがえた色は、もう一度「まとめ」の表で確認してみましょう。")+'</p><div class="btnrow center"><button class="btn primary" id="again">もう一度</button><button class="btn" id="home">ホームへ</button></div></section>';
    if(pct>=70)burst();
    $("#again").onclick=function(){go("color");};
    $("#home").onclick=function(){go("home");};
  }
  show();
}

/* ---- 起動 ---- */
shell();
var h0=(location.hash||"").replace("#","");
go(["home","study","cards","quiz","color"].indexOf(h0)>=0?h0:"home");
})();
